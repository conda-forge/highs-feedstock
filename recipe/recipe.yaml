schema_version: 1

context:
  name: HiGHS
  version: "1.16.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/ERGO-Code/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 0fa9da512955fb08c6cca7bfb274ca12e8a0e8a12e44189bd6e0c355ce7701bc

build:
  number: 0

requirements:
  build:
    - ${{ compiler('cxx') }}
    - cmake >=3.15
    - if: win
      then: ninja
      else: make
    - ${{ stdlib("c") }}
  run_exports:
    - ${{ pin_subpackage('highs', upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - highs/Highs.h
      lib:
        - highs
  - files:
      source:
        - check/instances/afiro.mps
    script:
      - highs check/instances/afiro.mps

about:
  summary: HiGHS is a high performance serial and parallel solver for large scale sparse linear optimization problems
  description: |
    HiGHS is a high performance serial and parallel solver for large scale sparse linear optimization problems
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/ERGO-Code/HiGHS
  repository: https://github.com/ERGO-Code/HiGHS
  documentation: https://highs.dev

extra:
  recipe-maintainers:
    - galabovaa
    - adament
    - jschueller
    - julian-belina
    - DerThorsten
